name: 기능
description: 새 기능이나 기존 기능 변경
labels: ["enhancement"]
body:
  - type: input
    id: prd
    attributes:
      label: PRD 기능 ID
      description: "`01` PRD의 ID. 없으면 '신규'"
      placeholder: 예) C3, D2, E4
  - type: textarea
    id: what
    attributes:
      label: 무엇을
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 확인할 수 있는 조건으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: 관련 문서 절
      description: 바뀌어야 할 문서가 있으면 함께 적습니다. 예) `05` 테이블 추가, `06` 엔드포인트 추가
